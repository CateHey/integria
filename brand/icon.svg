<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- IntegrIA Tech: partículas dispersas que se integran en una esfera -->
  <defs>
    <linearGradient id="g" x1="96" y1="416" x2="416" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1E5BFF"/>
      <stop offset="1" stop-color="#00D4FF"/>
    </linearGradient>
    <radialGradient id="glow" cx="300" cy="250" r="280" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1E5BFF" stop-opacity=".38"/>
      <stop offset="1" stop-color="#1E5BFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hot" cx="0" cy="0" r="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".45" stop-color="#00D4FF"/>
      <stop offset="1" stop-color="#00D4FF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="#05070D"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>

  <!-- partículas sueltas -->
  <g stroke="url(#g)" stroke-width="4" stroke-linecap="round" opacity=".55">
    <line x1="112" y1="112" x2="168" y2="72"/>
    <line x1="112" y1="112" x2="74" y2="172"/>
    <line x1="112" y1="112" x2="228" y2="134"/>
    <line x1="74" y1="172" x2="144" y2="314"/>
  </g>
  <g fill="url(#g)">
    <circle cx="112" cy="112" r="10"/>
    <circle cx="168" cy="72" r="6.5"/>
    <circle cx="74" cy="172" r="6.5"/>
    <circle cx="62" cy="94" r="4" opacity=".5"/>
  </g>

  <!-- esfera -->
  <g transform="rotate(-20 276 266)">
    <g fill="none" stroke="url(#g)" stroke-linecap="round">
      <circle cx="276" cy="266" r="140" stroke-width="12"/>
      <ellipse cx="276" cy="266" rx="56" ry="140" stroke-width="7" opacity=".8"/>
      <ellipse cx="276" cy="266" rx="140" ry="48" stroke-width="7" opacity=".8"/>
    </g>
    <g fill="url(#g)">
      <circle cx="276" cy="126" r="14"/>
      <circle cx="276" cy="406" r="14"/>
      <circle cx="136" cy="266" r="14"/>
      <circle cx="416" cy="266" r="14"/>
      <circle cx="223" cy="221" r="10"/>
      <circle cx="329" cy="221" r="10"/>
      <circle cx="223" cy="311" r="10"/>
    </g>
    <circle cx="329" cy="311" r="30" fill="url(#hot)" opacity=".7"/>
    <circle cx="329" cy="311" r="11" fill="#FFFFFF"/>
  </g>
</svg>
