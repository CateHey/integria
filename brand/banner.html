<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>IntegrIA Tech banner</title>
<!-- Fuente del banner. Exportar: banner.html?f=og (1200x630) o ?f=li (1584x396). Ver render.ps1 -->
<style>
@font-face { font-family: "Geist"; font-weight: 100 900; src: url("../web/assets/fonts/geist-latin-wght-normal.woff2") format("woff2"); }
@font-face { font-family: "IBM Plex Mono"; font-weight: 500; src: url("../web/assets/fonts/ibm-plex-mono-latin-500-normal.woff2") format("woff2"); }
:root { --void: #05070D; --blue: #1E5BFF; --cyan: #00D4FF; --mist: #A9B4CC; --line-d: rgba(169,180,204,.14); }
* { box-sizing: border-box; }
html, body { margin: 0; overflow: hidden; }
body { background: var(--void); color: #fff; font-family: "Geist", "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
.b { position: relative; overflow: hidden; background: var(--void); }
.glow { position: absolute; inset: 0;
  background: radial-gradient(45% 70% at 74% 50%, rgba(30,91,255,.30), transparent 70%),
              radial-gradient(35% 50% at 10% 95%, rgba(0,212,255,.08), transparent 70%); }
.grid { position: absolute; inset: 0; opacity: .6;
  background-image: linear-gradient(var(--line-d) 1px, transparent 1px), linear-gradient(90deg, var(--line-d) 1px, transparent 1px);
  -webkit-mask-image: radial-gradient(70% 80% at 60% 50%, #000 15%, transparent 80%); }
svg.field { position: absolute; inset: 0; width: 100%; height: 100%; }
.copy { position: absolute; display: flex; flex-direction: column; }
.mono { font-family: "IBM Plex Mono", monospace; font-weight: 500; text-transform: uppercase; letter-spacing: .14em; color: var(--mist); }
.ia { background: linear-gradient(90deg, var(--blue), var(--cyan)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.logo { display: flex; align-items: baseline; gap: 10px; }
.logo b { font-weight: 600; letter-spacing: -.045em; }
.logo b .ia { font-weight: 700; letter-spacing: -.02em; }
.logo .tag { font-family: "IBM Plex Mono", monospace; letter-spacing: .22em; }
h1 { margin: 0; font-weight: 500; letter-spacing: -.055em; line-height: .96; }
h1 span { display: block; }
.eyebrow { display: flex; align-items: center; gap: 14px; }
.eyebrow::before { content: ""; width: 32px; height: 1px; background: var(--cyan); }
.foot { position: absolute; display: flex; justify-content: space-between; align-items: center; }

/* Open Graph 1200x630 */
.og { width: 1200px; height: 630px; }
.og .grid { background-size: 72px 72px; }
.og .copy { left: 72px; top: 64px; bottom: 64px; width: 640px; justify-content: space-between; }
.og .logo b { font-size: 34px; } .og .logo .tag { font-size: 13px; }
.og .eyebrow { font-size: 15px; margin-bottom: 22px; }
.og h1 { font-size: 78px; }
.og .foot { left: 72px; right: 72px; bottom: 64px; font-size: 14px; justify-content: flex-end; }

/* LinkedIn 1584x396: la foto de perfil tapa la esquina inferior izquierda */
.li { width: 1584px; height: 396px; }
.li .grid { background-size: 66px 66px; }
.li .copy { left: 520px; top: 0; bottom: 0; width: 640px; justify-content: center; gap: 18px; }
.li .logo b { font-size: 30px; } .li .logo .tag { font-size: 12px; }
.li h1 { font-size: 60px; }
.li .eyebrow { font-size: 13px; }
.li .foot { left: 520px; bottom: 36px; font-size: 13px; }
</style>
</head>
<body>
<div class="b" id="b">
  <div class="glow"></div>
  <div class="grid"></div>
  <svg class="field" id="field" aria-hidden="true"></svg>
  <div class="copy" id="copy"></div>
  <div class="foot mono" id="foot"></div>
</div>
<script>
const f = new URLSearchParams(location.search).get('f') || 'og';
const b = document.getElementById('b');
b.className = 'b ' + f;
const W = f === 'li' ? 1584 : 1200, H = f === 'li' ? 396 : 630;

const logo = '<div class="logo"><b>Integr<span class="ia">IA</span></b><span class="tag">TECH</span></div>';
const h1 = '<h1><span>Proyectos de TI</span><span class="ia">que se terminan</span><span>y funcionan.</span></h1>';
document.getElementById('copy').innerHTML = f === 'li'
  ? logo + h1
  : logo + '<div><p class="eyebrow mono" style="margin-top:0">Consultoría en TI · Lima</p>' + h1 + '</div><div></div>';
document.getElementById('foot').innerHTML = '<span>integriatech.pe</span>';

// Red de partículas: caos a la izquierda que se integra en una esfera (mismo motivo que el fondo 3D del sitio)
function mulberry32(s) { return () => { s |= 0; s = (s + 0x6d2b79f5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const rand = mulberry32(2026);
const gauss = () => (rand() + rand() + rand() - 1.5) / 1.5;
const mix = (t) => { t = Math.max(0, Math.min(1, t)); const a = [30, 91, 255], c = [0, 212, 255]; return `rgb(${a.map((v, i) => Math.round(v + (c[i] - v) * t)).join(',')})`; };

const cfg = f === 'li'
  ? { cx: 1320, cy: 198, R: 165, N: 360, chaos: 60, cx0: 1100, spread: [70, 120] }
  : { cx: 900, cy: 315, R: 235, N: 520, chaos: 70, cx0: 640, spread: [200, 230] };

const pts = [];
const ry = 0.55, rx = 0.38;
for (let i = 0; i < cfg.N; i++) {
  const y = 1 - (i + .5) / cfg.N * 2, r = Math.sqrt(1 - y * y), th = i * Math.PI * (3 - Math.sqrt(5));
  let x = Math.cos(th) * r, z = Math.sin(th) * r, yy = y;
  let x1 = x * Math.cos(ry) + z * Math.sin(ry), z1 = -x * Math.sin(ry) + z * Math.cos(ry);
  let y2 = yy * Math.cos(rx) - z1 * Math.sin(rx), z2 = yy * Math.sin(rx) + z1 * Math.cos(rx);
  pts.push({ x: cfg.cx + x1 * cfg.R, y: cfg.cy + y2 * cfg.R, d: (z2 + 1) / 2, s: true });
}
for (let i = 0; i < cfg.chaos; i++) {
  const t = rand();
  pts.push({ x: cfg.cx0 - cfg.spread[0] * Math.abs(gauss()) * 1.6 + t * 60, y: cfg.cy + gauss() * cfg.spread[1], d: 0.15 + rand() * 0.5, s: false });
}

let lines = '', dots = '';
pts.forEach((p, i) => {
  const near = pts.map((q, j) => [ (q.x - p.x) ** 2 + (q.y - p.y) ** 2, j ])
    .filter(([d, j]) => j > i && (p.s === pts[j].s || d < 70 * 70)).sort((a, c) => a[0] - c[0]).slice(0, 2);
  near.forEach(([d, j]) => {
    const q = pts[j];
    if (Math.sqrt(d) > (p.s ? cfg.R * 0.32 : 110)) return;
    const o = ((p.d + q.d) / 2) * (p.s ? 0.55 : 0.35);
    lines += `<line x1="${p.x.toFixed(1)}" y1="${p.y.toFixed(1)}" x2="${q.x.toFixed(1)}" y2="${q.y.toFixed(1)}" stroke="${mix((p.x - cfg.cx0 + 200) / (cfg.R * 2.4))}" stroke-opacity="${o.toFixed(2)}" stroke-width="1"/>`;
  });
});
pts.forEach((p) => {
  const r = p.s ? 0.8 + p.d * 2.4 : 0.8 + p.d * 1.8;
  dots += `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${r.toFixed(2)}" fill="${p.d > .93 && p.s ? '#fff' : mix((p.x - cfg.cx0 + 200) / (cfg.R * 2.4))}" fill-opacity="${(0.2 + p.d * 0.8).toFixed(2)}"/>`;
});
const field = document.getElementById('field');
field.setAttribute('viewBox', `0 0 ${W} ${H}`);
field.innerHTML = `<defs><radialGradient id="core"><stop offset="0" stop-color="#1E5BFF" stop-opacity=".25"/><stop offset="1" stop-color="#1E5BFF" stop-opacity="0"/></radialGradient></defs>
  <circle cx="${cfg.cx}" cy="${cfg.cy}" r="${cfg.R * 1.1}" fill="url(#core)"/>` + lines + dots;
</script>
</body>
</html>
